[package]
name = "propel_compiler"
version = "0.2.0"
description = """
Code generation for Propel: turns a parsed template into Rust.
"""
license = "MIT"
repository = "https://github.com/lajennylove/Propel"
homepage = "https://propel.rocketboost.rs"
keywords = ["templating", "blade", "rocket", "build"]
categories = ["template-engine", "development-tools::build-utils"]
edition = "2021"
rust-version = "1.78"

[dependencies]
propel_parser = { version = "0.2.0", path = "../propel_parser" }
propel_runtime = { version = "0.2.0", path = "../propel_runtime" }

[lints]
workspace = true
