[package]
name = "propel_macros"
version = "0.2.0"
description = """
Proc macros for Propel: check a context against the templates that use it,
and compile views from a directory.
"""
license = "MIT"
repository = "https://github.com/lajennylove/Propel"
homepage = "https://propel.rocketboost.rs"
keywords = ["templating", "blade", "rocket", "macros"]
categories = ["development-tools::procedural-macro-helpers"]
edition = "2021"
rust-version = "1.78"

[lib]
proc-macro = true

[dependencies]
propel_compiler = { version = "0.2.0", path = "../propel_compiler" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true
