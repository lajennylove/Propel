[package]
name = "propel_macros"
version = "0.1.0"
description = """
Proc macros for Propel: check a context against the templates that use it,
and compile views from a directory.
"""
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.78"
publish = false

[lib]
proc-macro = true

[dependencies]
propel_compiler = { path = "../propel_compiler" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true
