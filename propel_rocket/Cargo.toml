[package]
name = "propel_rocket"
version = "0.2.0"
description = """
Rocket integration for Propel: the PropelView responder.
"""
license = "MIT"
repository = "https://github.com/lajennylove/Propel"
homepage = "https://propel.rocketboost.rs"
keywords = ["templating", "blade", "rocket", "views"]
