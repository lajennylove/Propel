[package]
name = "propel_runtime"
version = "0.2.0"
description = """
Dev-mode renderer for Propel: renders templates at request time, reading
the source from disk so edits show up without a rebuild.
"""
license = "MIT"
repository = "https://github.com/lajennylove/Propel"
homepage = "https://propel.rocketboost.rs"
keywords = ["templating", "blade", "rocket", "views"]
categories = ["template-engine"]
edition = "2021"
rust-version = "1.75"

[dependencies]
propel_parser = { version = "0.2.0", path = "../propel_parser" }
serde = "1"
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies.criterion]
version = "0.5"
default-features = false

[[bench]]
name = "render"
harness = false
